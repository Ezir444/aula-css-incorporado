<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Ezirius • Página Oficial</title>
</head>

<body>

  <!-- ====================================================================
       TOPO & MENU (Com ID para ancoragem e Seletor #topo)
       ==================================================================== -->
  <header>
    <div>
      <h1>Ezirius Shop Geek</h1>
      <p>Seu refúgio geek, esta logo aqui.</p>

      <nav>
        <!-- Links internos usando ancoragem por ID (#secao) -->
        <a href="#sobre">Sobre</a>
        <a href="#servicos">Serviços</a>
        <a href="#recurso">Preços / Contato</a>
      </nav>
    </div>
  </header>

  <!-- ====================================================================
       CONTEÚDO PRINCIPAL (Centralizado na .container)
       ==================================================================== -->
  <main class="container" style="margin-top: 32px;">

    <!-- Seção 1: Apresentação -->
    <section id="sobre">
        <h2>Nossa loja</h2>
        <p>Possuimos uma variedade de produtos, desde camisetas com stampa, Acessórios e jogos. Trabalhamos com entregas em até 24hrs (dependendo da região)</p>
    </section>

    <!-- Seção 2: Cards de Produtos/Serviços -->
    <section id="servicos">
        <video controls width="720" preload="metadata" >
            <source src="assets/videos/video_loja_geek.mp4" type="video/mp4" >
        </video>
        <div id="card_camisas">
            
        </div>
        <div id="card_jogos">

        </div>
    </section>

    <!-- Seção 3: RECURSO MANDATÓRIO (Pelo menos 1 dos 3 recursos abaixo) -->
    <section id="recurso">

    </section>

    <!-- Destaque / Promoção com <aside> -->
    <aside>

    </aside>

  </main>

  <!-- Rodapé -->
  <footer>

  </footer>

</body>

</html>
